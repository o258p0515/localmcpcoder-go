name: Azure DevOps REST API Probe
'on':
  workflow_dispatch:
    inputs:
      allow_mutating_probes:
        description: "Enable temporary write probes (default read-only)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      AZURE_DEVOPS_ORG_URL: ${{ secrets.AZURE_DEVOPS_ORG_URL }}
      ALLOW_MUTATING_PROBES: ${{ inputs.allow_mutating_probes }}
    steps:
      - name: Probe REST endpoints without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_DEVOPS_PAT"
          test -n "$AZURE_DEVOPS_ORG_URL"
          AUTH="$(printf ':%s' "$AZURE_DEVOPS_PAT" | base64 -w0)"
          echo "::add-mask::$AZURE_DEVOPS_PAT"
          echo "::add-mask::$AUTH"
          export AZDO_AUTH="$AUTH"
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          org=os.environ["AZURE_DEVOPS_ORG_URL"].rstrip("/")
          h={"Authorization":"Basic "+os.environ["AZDO_AUTH"],"Accept":"application/json"}
          def get(k,p,accept="application/json"):
            u=org+p+("&" if "?" in p else "?")+"api-version=7.1"
            q=urllib.request.Request(u,headers={**h,"Accept":accept})
            try:
              r=urllib.request.urlopen(q,timeout=25); code=r.status; ct=r.headers.get("Content-Type",""); raw=r.read()
            except urllib.error.HTTPError as e: code=e.code; ct=e.headers.get("Content-Type",""); raw=e.read()
            try: d=json.loads(raw)
            except: d={"preview":raw[:180].decode("utf8","replace")}
            state="PASS" if 200<=code<300 and code!=203 and "html" not in ct.lower() else ("NOT_FOUND" if code==404 else ("BLOCKED" if code in (401,403,203) or "html" in ct.lower() else "FAIL"))
            out={"probe":k,"method":"GET","path":p,"api_version":"7.1","http_status":code,"content_type":ct,"result":state}
            if isinstance(d,dict):
              out["keys"]=list(d)[:20]
              if "message" in d: out["message"]=str(d["message"])[:300]
              if isinstance(d.get("value"),list):
                out["count"]=len(d["value"])
                out["items"]=[{x:v for x,v in z.items() if x in ("id","name","state","visibility","defaultBranch","remoteUrl","folder","revision","status","result","buildNumber","queueTime","startTime","finishTime","isHosted","lineCount")} for z in d["value"][:8] if isinstance(z,dict)]
              if isinstance(d.get("records"),list): out["records"]=[{x:v for x,v in z.items() if x in ("id","parentId","type","name","state","result","log","issues")} for z in d["records"][:12]]
            elif "preview" in d: out["preview"]=d["preview"]
            print(json.dumps(out))
            return d
          projects=get("A1","/_apis/projects")
          ps=projects.get("value",[]) if isinstance(projects,dict) else []
          if ps:
            p=urllib.parse.quote(ps[0]["name"],safe="")
            get("A2",f"/{p}/_apis/git/repositories")
            pipes=get("A3",f"/{p}/_apis/pipelines")
            pls=pipes.get("value",[]) if isinstance(pipes,dict) else []
            if pls:
              pid=pls[0]["id"]; get("A4",f"/{p}/_apis/pipelines/{pid}")
              builds=get("C1",f"/{p}/_apis/build/builds?definitions={pid}&$top=10")
              bs=builds.get("value",[]) if isinstance(builds,dict) else []
              if bs:
                bid=bs[0]["id"]; get("C2",f"/{p}/_apis/build/builds/{bid}")
                get("D1",f"/{p}/_apis/build/builds/{bid}/timeline")
                logs=get("D2",f"/{p}/_apis/build/builds/{bid}/logs")
                ls=logs.get("value",[]) if isinstance(logs,dict) else []
                if ls:
                  lid=ls[0]["id"]; get("D3-text",f"/{p}/_apis/build/builds/{bid}/logs/{lid}?startLine=1&endLine=50","text/plain")
                  get("D3-json",f"/{p}/_apis/build/builds/{bid}/logs/{lid}?startLine=1&endLine=50","application/json")
                else: print(json.dumps({"probe":"D3","result":"BLOCKED_NO_LOG"}))
              else:
                for x in ("C2","D1","D2","D3"): print(json.dumps({"probe":x,"result":"BLOCKED_NO_BUILD"}))
            else:
              print(json.dumps({"probe":"A4","result":"BLOCKED_NO_PIPELINE"}))
              for x in ("C1","C2","D1","D2","D3"): print(json.dumps({"probe":x,"result":"BLOCKED_NO_PIPELINE"}))
            groups=get("B1",f"/{p}/_apis/distributedtask/variablegroups")
            get("E1",f"/{p}/_apis/build/builds/999999999")
          else:
            for x in ("A2","A3","A4","B1","C1","C2","D1","D2","D3","E1"): print(json.dumps({"probe":x,"result":"BLOCKED_NO_PROJECT"}))
          get("A5","/_apis/distributedtask/pools")
          # End-to-end bootstrap: create an isolated Azure Repo branch + temporary YAML pipeline.
          if os.environ.get("ALLOW_MUTATING_PROBES","false").lower()=="true" and ps:
            import time, uuid
            project=ps[0]
            pname=urllib.parse.quote(project["name"],safe="")
            repo_list=get("A2-recheck",f"/{pname}/_apis/git/repositories")
            repo_items=repo_list.get("value",[]) if isinstance(repo_list,dict) else []
            if not repo_items:
              print(json.dumps({"probe":"PIPELINE-BOOTSTRAP","result":"BLOCKED_NO_REPOSITORY"}))
            else:
              repo=repo_items[0]
              rid=repo["id"]
              run_tag=os.environ.get("GITHUB_RUN_ID","manual")
              branch="refs/heads/issue69-probe-"+run_tag
              file_path="/.azure-pipelines/issue69-probe.yml"
              yaml_files={
                "/.azure-pipelines/issue69-linux.yml": "\n".join(["pool:","  vmImage: ubuntu-latest","steps:","- bash: |","    echo 'ISSUE69_LINUX_START'","    echo 'ISSUE69_LOG_MARKER_001'","    echo 'ISSUE69_LOG_MARKER_002'","    echo 'ISSUE69_LINUX_END'","  displayName: Issue 69 Linux probe"])+"\n",
                "/.azure-pipelines/issue69-live.yml": "\n".join(["pool:","  vmImage: ubuntu-latest","steps:","- bash: |","    echo 'ISSUE69_LIVE_START'","    echo 'ISSUE69_LIVE_LOG_MARKER_001'","    sleep 150","    echo 'ISSUE69_LIVE_END'","  displayName: Issue 69 live log and cancellation probe"])+"\n",
                "/.azure-pipelines/issue69-windows.yml": "\n".join(["pool:","  vmImage: windows-latest","steps:","- powershell: |","    Write-Host 'ISSUE69_WINDOWS_START'","    Write-Host 'ISSUE69_WINDOWS_LOG_MARKER_001'","    Write-Host 'ISSUE69_WINDOWS_END'","  displayName: Issue 69 Windows probe"])+"\n"
              }
              pipeline_defs=[]
              branch_created=False
              def api(label,method,path,payload=None,accept="application/json"):
                url=org+path+("?" if "?" not in path else "&")+"api-version=7.1"
                data=None if payload is None else json.dumps(payload).encode()
                req=urllib.request.Request(url,data=data,headers={**h,"Accept":accept,"Content-Type":"application/json"},method=method)
                try:
                  with urllib.request.urlopen(req,timeout=35) as rr: code=rr.status; raw=rr.read(); ct=rr.headers.get("Content-Type","")
                except urllib.error.HTTPError as ee: code=ee.code; raw=ee.read(); ct=ee.headers.get("Content-Type","")
                try: doc=json.loads(raw) if raw else {}
                except: doc={"preview":raw[:500].decode("utf8","replace")}
                summary={k:v for k,v in doc.items() if k in ("id","name","state","result","status","url","revision","message","typeKey","count","value","configuration","folder","path","preview")} if isinstance(doc,dict) else {"preview":str(doc)[:500]}
                if isinstance(summary,dict) and isinstance(summary.get("value"),list):
                  summary["count"]=len(summary["value"])
                  summary["value"]=[{k:v for k,v in x.items() if k in ("id","name","state","result","status","lineCount","createdOn","lastChangedOn","defaultBranch","remoteUrl")} for x in summary["value"][:8] if isinstance(x,dict)]
                if isinstance(doc,dict) and isinstance(doc.get("records"),list):
                  summary["records_count"]=len(doc["records"])
                  summary["records"]=[{k:v for k,v in x.items() if k in ("id","parentId","type","name","state","result","log","issues")} for x in doc["records"][:12] if isinstance(x,dict)]
                if isinstance(doc,dict) and "preview" in doc: summary["preview"]=doc["preview"][:500]
                if isinstance(doc,str): summary={"preview":doc[:500],"line_count":len(doc.splitlines())}
                print(json.dumps({"probe":label,"method":method,"path":path,"http_status":code,"content_type":ct,"result":"PASS" if 200<=code<300 else "FAIL","response":summary}))
                return code,doc
              try:
                zero="0000000000000000000000000000000000000000"
                # Clean up resources left by an interrupted earlier probe before creating this run's assets.
                _,old_pipelines=api("PIPELINE-stale-list","GET",f"/{pname}/_apis/pipelines")
                for stale in (old_pipelines.get("value",[]) if isinstance(old_pipelines,dict) else []):
                  if str(stale.get("name","")).startswith("LocalMCP-Issue69-"):
                    api("PIPELINE-stale-delete-"+str(stale.get("id")),"DELETE",f"/{pname}/_apis/build/definitions/{stale['id']}")
                _,old_refs=api("PIPELINE-stale-branches","GET",f"/{pname}/_apis/git/repositories/{rid}/refs?filter=heads/issue69-probe-")
                stale_refs=[x for x in (old_refs.get("value",[]) if isinstance(old_refs,dict) else []) if str(x.get("name","")).startswith("refs/heads/issue69-probe-")]
                _,repo_state=api("PIPELINE-repository-state","GET",f"/{pname}/_apis/git/repositories/{rid}")
                if stale_refs and isinstance(repo_state,dict) and repo_state.get("defaultBranch") in [x.get("name") for x in stale_refs]:
                  api("PIPELINE-reset-default-branch","PATCH",f"/{pname}/_apis/git/repositories/{rid}",{"defaultBranch":None})
                if stale_refs:
                  api("PIPELINE-stale-delete-branches","POST",f"/{pname}/_apis/git/repositories/{rid}/refs",[{"name":x["name"],"oldObjectId":x["objectId"],"newObjectId":zero} for x in stale_refs])
                api("A2-post-cleanup","GET",f"/{pname}/_apis/git/repositories")
                api("A3-post-cleanup","GET",f"/{pname}/_apis/pipelines")
                _,refs=api("PIPELINE-branch-source","GET",f"/{pname}/_apis/git/repositories/{rid}/refs?filter=heads/main")
                ref_items=refs.get("value",[]) if isinstance(refs,dict) else []
                main_ref=next((x for x in ref_items if x.get("name")=="refs/heads/main"),None)
                zero="0000000000000000000000000000000000000000"
                parents=[main_ref["objectId"]] if main_ref else []
                changes=[{"changeType":"add","item":{"path":path},"newContent":{"content:":content,"contentType":"rawtext"}} for path,content in yaml_files.items()]
                for c in changes: c["newContent"]["content"]=c["newContent"].pop("content:")
                push={"refUpdates":[{"name":branch,"oldObjectId":zero}],"commits":[{"comment":"Temporary Issue 69 pipeline probes","parents":parents,"changes":changes}]}
                code,_=api("PIPELINE-create-probe-branch","POST",f"/{pname}/_apis/git/repositories/{rid}/pushes",push)
                branch_created=200<=code<300
                if branch_created:
                  for path in yaml_files:
                    pname_def="LocalMCP-Issue69-"+path.rsplit("/",1)[-1].replace(".yml","")+"-"+run_tag
                    cfg={"name":pname_def,"folder":"\\LocalMCP-Issue69-Probe","configuration":{"type":"yaml","path":path,"repository":{"id":rid,"name":repo["name"],"type":"azureReposGit"}}}
                    code,pipe=api("PIPELINE-create-"+path.rsplit("/",1)[-1],"POST",f"/{pname}/_apis/pipelines",cfg)
                    if 200<=code<300 and isinstance(pipe,dict) and pipe.get("id"):
                      pipeline_defs.append({"id":pipe["id"],"name":pname_def,"path":path})
                      api("A4-pipeline-detail-"+str(pipe["id"]),"GET",f"/{pname}/_apis/pipelines/{pipe['id']}")
                  def queue_and_poll(label,definition,live=False,windows=False):
                    body={"resources":{"repositories":{"self":{"repository":{"id":rid,"type":"azureReposGit"},"refName":branch}}}}
                    code,run=api(label+"-queue","POST",f"/{pname}/_apis/pipelines/{definition['id']}/runs",body)
                    run_id=run.get("id") if isinstance(run,dict) else None
                    if 200<=code<300 and run_id:
                      api("C1-build-list-"+label,"GET",f"/{pname}/_apis/build/builds?definitions={definition['id']}&$top=10")
                    if not (200<=code<300 and run_id):
                      print(json.dumps({"probe":label,"result":"QUEUE_FAILED"})); return None
                    deadline=time.time()+240
                    current=None
                    for _ in range(40):
                      _,current=api(label+"-status","GET",f"/{pname}/_apis/build/builds/{run_id}")
                      if isinstance(current,dict) and current.get("status")=="completed": break
                      if live and isinstance(current,dict) and current.get("status")=="inProgress": break
                      time.sleep(6)
                    if live and isinstance(current,dict) and current.get("status")=="inProgress":
                      api("D1-live-timeline","GET",f"/{pname}/_apis/build/builds/{run_id}/timeline")
                      _,logs=api("D2-live-logs","GET",f"/{pname}/_apis/build/builds/{run_id}/logs")
                      items=logs.get("value",[]) if isinstance(logs,dict) else logs.get("logs",[]) if isinstance(logs,dict) else []
                      if items:
                        lid=items[0]["id"]
                        api("D3-live-text","GET",f"/{pname}/_apis/build/builds/{run_id}/logs/{lid}?startLine=1&endLine=50",accept="text/plain")
                        api("D3-live-json","GET",f"/{pname}/_apis/build/builds/{run_id}/logs/{lid}?startLine=1&endLine=50",accept="application/json")
                      api("C4-cancel","PATCH",f"/{pname}/_apis/build/builds/{run_id}",{"status":"cancelling"})
                      for _ in range(12):
                        _,current=api("C4-poll-cancel","GET",f"/{pname}/_apis/build/builds/{run_id}")
                        if isinstance(current,dict) and current.get("status")=="completed": break
                        time.sleep(5)
                    elif isinstance(current,dict) and current.get("status")=="completed":
                      api("D1-final-timeline","GET",f"/{pname}/_apis/build/builds/{run_id}/timeline")
                      _,logs=api("D2-final-logs","GET",f"/{pname}/_apis/build/builds/{run_id}/logs")
                      items=logs.get("value",[]) if isinstance(logs,dict) else logs.get("logs",[]) if isinstance(logs,dict) else []
                      if items:
                        lid=items[0]["id"]
                        api("D3-final-text","GET",f"/{pname}/_apis/build/builds/{run_id}/logs/{lid}?startLine=1&endLine=50",accept="text/plain")
                        api("D3-final-json","GET",f"/{pname}/_apis/build/builds/{run_id}/logs/{lid}?startLine=1&endLine=50",accept="application/json")
                    print(json.dumps({"probe":label+"-summary","run_id":run_id,"status":current.get("status") if isinstance(current,dict) else None,"result":current.get("result") if isinstance(current,dict) else None}))
                    return run_id
                  linux=next((x for x in pipeline_defs if "linux.yml" in x["path"]),None)
                  live=next((x for x in pipeline_defs if "live.yml" in x["path"]),None)
                  win=next((x for x in pipeline_defs if "windows.yml" in x["path"]),None)
                  if linux: queue_and_poll("C3-linux",linux)
                  if live: queue_and_poll("C3-live",live,live=True)
                  if win: queue_and_poll("C3-windows",win,windows=True)
                  # Queue Linux and Windows back-to-back to observe real hosted parallelism/queue behavior.
                  if linux and win:
                    common={"resources":{"repositories":{"self":{"repository":{"id":rid,"type":"azureReposGit"},"refName":branch}}}}
                    _,cr1=api("C3-concurrency-linux-queue","POST",f"/{pname}/_apis/pipelines/{linux['id']}/runs",common)
                    _,cr2=api("C3-concurrency-windows-queue","POST",f"/{pname}/_apis/pipelines/{win['id']}/runs",common)
                    ids=[("linux",cr1.get("id")) if isinstance(cr1,dict) else ("linux",None),("windows",cr2.get("id")) if isinstance(cr2,dict) else ("windows",None)]
                    for _ in range(40):
                      states={}
                      for label,cid in ids:
                        if cid:
                          _,st=api("C3-concurrency-"+label+"-status","GET",f"/{pname}/_apis/build/builds/{cid}")
                          states[label]=(st.get("status"),st.get("result")) if isinstance(st,dict) else (None,None)
                      if states and all(v[0]=="completed" for v in states.values()): break
                      time.sleep(6)
                    print(json.dumps({"probe":"C3-hosted-parallelism-summary","run_ids":dict(ids),"states":states}))
              finally:
                for definition in pipeline_defs:
                  api("PIPELINE-delete-"+str(definition["id"]),"DELETE",f"/{pname}/_apis/build/definitions/{definition['id']}")
                if branch_created:
                  _,branch_refs=api("PIPELINE-cleanup-read-branch","GET",f"/{pname}/_apis/git/repositories/{rid}/refs?filter=heads/issue69-probe-{run_tag}")
                  found=next((x for x in (branch_refs.get("value",[]) if isinstance(branch_refs,dict) else []) if x.get("name")==branch),None)
                  if found:
                    api("PIPELINE-cleanup-delete-branch","POST",f"/{pname}/_apis/git/repositories/{rid}/refs",[{"name":branch,"oldObjectId":found["objectId"],"newObjectId":zero}])

          else: print(json.dumps({"probe":"PIPELINE-BOOTSTRAP","result":"NOT_RUN_READ_ONLY"}))
          if os.environ.get("ALLOW_MUTATING_PROBES","false").lower()=="true" and ps:
            import uuid
            pn=urllib.parse.quote(ps[0]["name"],safe="")
            base=org+f"/{pn}/_apis/distributedtask/variablegroups"
            name="LocalMCP-Issue69-Probe-"+os.environ.get("GITHUB_RUN_ID","manual")
            secret="ISSUE69_PROBE_"+uuid.uuid4().hex[:8].upper()
            body={"type":"Vsts","name":name,"description":"Temporary Issue #69 probe; auto-deleted","variables":{secret:{"value":uuid.uuid4().hex,"isSecret":True}},"variableGroupProjectReferences":[{"name":name,"description":"Temporary probe","projectReference":{"id":ps[0]["id"],"name":ps[0]["name"]}}]}
            # Remove stale probe groups left by an interrupted/older run before creating a fresh one.
            stale=groups.get("value",[]) if isinstance(groups,dict) else []
            for item in stale:
              if str(item.get("name","")).startswith("LocalMCP-Issue69-Probe-"):
                mutate_url=org+f"/_apis/distributedtask/variablegroups/{item['id']}?projectIds={ps[0]['id']}&api-version=7.1"
                req=urllib.request.Request(mutate_url,headers=h,method="DELETE")
                try:
                  with urllib.request.urlopen(req,timeout=30) as rr: print(json.dumps({"probe":"B2-stale-cleanup","http_status":rr.status,"result":"PASS"}))
                except urllib.error.HTTPError as ee: print(json.dumps({"probe":"B2-stale-cleanup","http_status":ee.code,"result":"FAIL"}))
            gid=None
            def mutate(label,method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers={**h,"Content-Type":"application/json"},method=method)
              try:
                with urllib.request.urlopen(req,timeout=30) as r: code=r.status; raw=r.read()
              except urllib.error.HTTPError as e: code=e.code; raw=e.read()
              try: d=json.loads(raw) if raw else {}
              except: d={}
              print(json.dumps({"probe":label,"method":method,"http_status":code,"result":"PASS" if 200<=code<300 else "FAIL","response_keys":list(d)[:15] if isinstance(d,dict) else []}))
              return code,d
            try:
              code,d=mutate("B2-create","POST",base+"?api-version=7.1",body)
              if 200<=code<300 and isinstance(d,dict):
                gid=d.get("id")
                if gid:
                  body["id"]=gid
                  mutate("B2-update","PUT",base+f"/{gid}?api-version=7.1",body)
            finally:
              if gid: mutate("B2-cleanup-delete","DELETE",org+f"/_apis/distributedtask/variablegroups/{gid}?projectIds={ps[0]['id']}&api-version=7.1")
          else: print(json.dumps({"probe":"B2","result":"NOT_RUN_READ_ONLY"}))
          if ps and not (pipes.get("value",[]) if isinstance(pipes,dict) else []):
            print(json.dumps({"probe":"C3","result":"BLOCKED_NO_PIPELINE"}))
            print(json.dumps({"probe":"C4","result":"BLOCKED_NO_BUILD"}))
          else:
            print(json.dumps({"probe":"C3","result":"NOT_RUN_READ_ONLY"}))
            print(json.dumps({"probe":"C4","result":"NOT_RUN_READ_ONLY"}))
          print(json.dumps({"probe":"E2","result":"PARTIAL","detail":"203 and HTML login responses are classified as blocked; invalid PAT is not intentionally tested"}))
          PY
