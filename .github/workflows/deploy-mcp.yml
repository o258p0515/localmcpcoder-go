name: Deploy one Hub MCP runner
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/hub-runner.yml'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-hub-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the stable public Hub runner
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching example-run.yml compatibility entrypoint; it starts a Hub-only runner."
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/example-run.yml/dispatches" -f ref=main
          echo "Hub-only public runner dispatch accepted."
