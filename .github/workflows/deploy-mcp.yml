name: Deploy one public MCP runner # refresh runner deployment
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/example-run.yml'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  replace-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The target workflow owns runner exclusivity through concurrency:
      # group: public-mcp-runner, cancel-in-progress: true.
      - name: Start exactly one fresh public MCP runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching one fresh public MCP runner; concurrency will cancel the previous instance."
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/example-run.yml/dispatches" -f ref=main
          echo "Dispatched one fresh public MCP runner."
