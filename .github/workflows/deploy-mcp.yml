name: Deploy one public MCP runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  replace-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop old public MCP runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --paginate --jq '.workflow_runs[] | select(.name == "Example remote MCP runner" and .status != "completed") | .id' |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Cancelling previous public MCP runner $run_id"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done

      - name: Start exactly one fresh public MCP runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/example-run.yml/dispatches" -f ref=main
          echo "Dispatched one fresh public MCP runner."
