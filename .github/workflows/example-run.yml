name: Example remote MCP runner (Hub)
on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: "Display name for an independent Hub runner instance"
        type: string
        required: false
        default: "public-mcp"
      runner_tags:
        description: "Comma-separated runner tags"
        type: string
        required: false
        default: "linux,go,gha,public"
      duration_seconds:
        description: "Runner lifetime in seconds (60-20400)"
        type: number
        required: false
        default: 20400
      runner_os:
        description: "Hosted runner operating system"
        type: choice
        options: [linux, windows]
        required: false
        default: linux
      account_alias:
        description: "Account alias used in runner tags"
        type: string
        required: false
        default: github
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-hub-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Hub runner inputs
        env:
          DISPATCH_RUNNER_NAME: ${{ inputs.runner_name }}
          RUNNER_TAGS: ${{ inputs.runner_tags }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          RUNNER_OS: ${{ inputs.runner_os }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH_RUNNER_NAME="${DISPATCH_RUNNER_NAME:-public-mcp}"
          RUNNER_TAGS="${RUNNER_TAGS:-linux,go,gha,public}"
          DURATION_SECONDS="${DURATION_SECONDS:-20400}"
          RUNNER_OS="${RUNNER_OS:-linux}"
          if [ "$RUNNER_OS" != "linux" ] && [ "$RUNNER_OS" != "windows" ]; then echo "::error title=Invalid OS::runner_os must be linux or windows"; exit 1; fi
          if [ -z "$DISPATCH_RUNNER_NAME" ] || [ "${#DISPATCH_RUNNER_NAME}" -gt 64 ] || [[ "$DISPATCH_RUNNER_NAME" == *$'\\n'* || "$DISPATCH_RUNNER_NAME" == *$'\\r'* ]]; then
            echo "::error title=Invalid runner name::Runner name must be 1-64 characters and contain no line breaks."
            exit 1
          fi
          if [ -z "$RUNNER_TAGS" ] || [ "${#RUNNER_TAGS}" -gt 200 ] || [[ "$RUNNER_TAGS" == *$'\\n'* || "$RUNNER_TAGS" == *$'\\r'* ]]; then
            echo "::error title=Invalid runner tags::Runner tags must be 1-200 characters and contain no line breaks."
            exit 1
          fi
          case "$DURATION_SECONDS" in
            ''|*[!0123456789]*)
              echo "::error title=Invalid duration::duration_seconds must be an integer between 60 and 20400."
              exit 1
              ;;
          esac
          if [ "$DURATION_SECONDS" -lt 60 ] || [ "$DURATION_SECONDS" -gt 20400 ]; then
            echo "::error title=Invalid duration::duration_seconds must be between 60 and 20400."
            exit 1
          fi
          echo "Validated Hub runner dispatch: name=$DISPATCH_RUNNER_NAME tags=$RUNNER_TAGS duration=$DURATION_SECONDS."

      - name: Dispatch Hub-only runner workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_RUNNER_NAME: ${{ inputs.runner_name }}
          RUNNER_TAGS: ${{ inputs.runner_tags }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          RUNNER_OS: ${{ inputs.runner_os }}
          ACCOUNT_ALIAS: ${{ inputs.account_alias }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH_RUNNER_NAME="${DISPATCH_RUNNER_NAME:-public-mcp}"
          RUNNER_TAGS="${RUNNER_TAGS:-go,gha,public}"
          DURATION_SECONDS="${DURATION_SECONDS:-20400}"
          RUNNER_OS="${RUNNER_OS:-linux}"
          ACCOUNT_ALIAS="${ACCOUNT_ALIAS:-github}"
          echo "Dispatching Hub runner '$DISPATCH_RUNNER_NAME'; no Cloudflare Tunnel or DNS operations are performed."
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/hub-runner.yml/dispatches" \
            -f ref=main \
            -f "inputs[runner_name]=$DISPATCH_RUNNER_NAME" \
            -f "inputs[runner_tags]=$RUNNER_TAGS" \
            -f "inputs[duration_seconds]=$DURATION_SECONDS" \
            -f "inputs[runner_os]=$RUNNER_OS" \
            -f "inputs[account_alias]=$ACCOUNT_ALIAS"
          echo "Hub runner workflow dispatched successfully."
