name: Example remote MCP runner
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
permissions:
  contents: read
concurrency:
  group: localmcpcoder-example-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Download latest Linux amd64 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/localmcpcoder"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'mcp-linux-amd64' --dir "$RUNNER_TEMP/localmcpcoder"
          chmod +x "$RUNNER_TEMP/localmcpcoder/mcp-linux-amd64"
      - name: Run MCP server with Cloudflare tunnel
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          MCP_HOST: ${{ secrets.MCP_HOST }}
        run: |
          test -n "$CF_API_TOKEN" || { echo 'CF_API_TOKEN secret is required'; exit 1; }
          test -n "$MCP_TOKEN" || { echo 'MCP_TOKEN secret is required'; exit 1; }
          test -n "$MCP_HOST" || { echo 'MCP_HOST secret is required'; exit 1; }
          "$RUNNER_TEMP/localmcpcoder/mcp-linux-amd64" --root "$GITHUB_WORKSPACE" --tunnel cloudflare --host "$MCP_HOST"
