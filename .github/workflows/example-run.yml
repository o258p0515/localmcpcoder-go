name: Example remote MCP runner (Hub)
on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: "Unique Hub runner name; reusing a name replaces its previous workflow"
        type: string
        required: false
        default: "public-mcp"
      runner_tags:
        description: "Comma-separated runner tags"
        type: string
        required: false
        default: "linux,go,gha,public"
      duration_seconds:
        description: "Runner lifetime in seconds (60-20400)"
        type: number
        required: false
        default: 20400
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-hub-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Hub runner inputs
        env:
          RUNNER_NAME: ${{ inputs.runner_name }}
          RUNNER_TAGS: ${{ inputs.runner_tags }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_NAME="${RUNNER_NAME:-public-mcp}"
          RUNNER_TAGS="${RUNNER_TAGS:-linux,go,gha,public}"
          DURATION_SECONDS="${DURATION_SECONDS:-20400}"
          SAFE_RUNNER_NAME="$(printf '%s' "$RUNNER_NAME" | LC_ALL=C tr -cd '[:alnum:]._-' )"
          SAFE_RUNNER_TAGS="$(printf '%s' "$RUNNER_TAGS" | LC_ALL=C tr -cd '[:alnum:]._,: -')"
          if [ -z "$RUNNER_NAME" ] || [ "${#RUNNER_NAME}" -gt 64 ] || [ "$SAFE_RUNNER_NAME" != "$RUNNER_NAME" ]; then
            echo "::error title=Invalid runner name::Use 1-64 ASCII letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi
          if [ -z "$RUNNER_TAGS" ] || [ "${#RUNNER_TAGS}" -gt 200 ] || [ "$SAFE_RUNNER_TAGS" != "$RUNNER_TAGS" ]; then
            echo "::error title=Invalid runner tags::Use a comma-separated list of simple tags."
            exit 1
          fi
          if [[ ! "$DURATION_SECONDS" =~ ^[0-9]+$ ]] || [ "$DURATION_SECONDS" -lt 60 ] || [ "$DURATION_SECONDS" -gt 20400 ]; then
            echo "::error title=Invalid duration::duration_seconds must be between 60 and 20400."
            exit 1
          fi
          echo "Validated Hub runner dispatch: name=$RUNNER_NAME tags=$RUNNER_TAGS duration=$DURATION_SECONDS."

      - name: Dispatch Hub-only runner workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_NAME: ${{ inputs.runner_name }}
          RUNNER_TAGS: ${{ inputs.runner_tags }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_NAME="${RUNNER_NAME:-public-mcp}"
          RUNNER_TAGS="${RUNNER_TAGS:-linux,go,gha,public}"
          DURATION_SECONDS="${DURATION_SECONDS:-20400}"
          echo "Dispatching Hub runner '$RUNNER_NAME'; no Cloudflare Tunnel or DNS operations are performed."
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/hub-runner.yml/dispatches" \
            -f ref=main \
            -f "inputs[runner_name]=$RUNNER_NAME" \
            -f "inputs[runner_tags]=$RUNNER_TAGS" \
            -f "inputs[duration_seconds]=$DURATION_SECONDS"
          echo "Hub runner workflow dispatched successfully."
