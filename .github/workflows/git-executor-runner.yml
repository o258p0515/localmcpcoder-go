name: LocalMCP Git Executor Runner
on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: Prefix for the paired Agent and Git executor runner IDs
        type: string
        required: false
        default: issue23
      duration_seconds:
        description: Runner lifetime in seconds (maximum 20400 / 5h40m)
        type: number
        required: true
        default: 20400
permissions:
  contents: read
concurrency:
  group: localmcp-git-executor-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  git-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go/go.mod
      - name: Validate paired runner configuration
        env:
          HUB_URLS: ${{ secrets.HUB_URLS }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          GIT_CREDENTIAL_URL: https://github-mcp-proxy.o258p0515.dpdns.org/internal/runner/git-credential
          GIT_EXECUTOR_TOKEN: ${{ secrets.GIT_EXECUTOR_TOKEN }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HUB_URLS"
          test -n "$MCP_TOKEN"
          test -n "$GIT_CREDENTIAL_URL"
          test -n "$GIT_EXECUTOR_TOKEN"
          if ! [[ "$DURATION_SECONDS" =~ ^[0-9]+$ ]] || [ "$DURATION_SECONDS" -lt 60 ] || [ "$DURATION_SECONDS" -gt 20400 ]; then
            echo "::error title=Invalid duration::duration_seconds must be between 60 and 20400"; exit 1
          fi
      - name: Build and test LocalMCP runner
        working-directory: go
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/localmcpcoder-git-executor" ./cmd/mcp
      - name: Verify dedicated Git executor token and paired-runner isolation
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          GIT_CREDENTIAL_URL: https://github-mcp-proxy.o258p0515.dpdns.org/internal/runner/git-credential
          GIT_EXECUTOR_TOKEN: ${{ secrets.GIT_EXECUTOR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          bash -n ./scripts/issue23-git-pair-smoke.sh
          bash ./scripts/issue23-git-pair-smoke.sh
      - name: Start paired Agent and Git-only Hub runners
        env:
          HUB_URLS: ${{ secrets.HUB_URLS }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          GIT_CREDENTIAL_URL: https://github-mcp-proxy.o258p0515.dpdns.org/internal/runner/git-credential
          GIT_EXECUTOR_TOKEN: ${{ secrets.GIT_EXECUTOR_TOKEN }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          RUNNER_NAME_PREFIX: ${{ inputs.runner_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/issue23-shared-workspace-$GITHUB_RUN_ID"
          BIN="/tmp/localmcpcoder-git-executor-$GITHUB_RUN_ID"
          sudo install -m 0755 "$RUNNER_TEMP/localmcpcoder-git-executor" "$BIN"
          mkdir -p "$ROOT"
          sudo groupadd --system mcp-workspace 2>/dev/null || true
          sudo useradd --system --create-home --home-dir /home/mcp-agent --shell /usr/sbin/nologin mcp-agent 2>/dev/null || true
          sudo useradd --system --create-home --home-dir /home/mcp-git --shell /usr/sbin/nologin mcp-git 2>/dev/null || true
          sudo usermod -aG mcp-workspace mcp-agent
          sudo usermod -aG mcp-workspace mcp-git
          sudo chown "$(id -un)":mcp-workspace "$ROOT"
          sudo chmod 3770 "$ROOT"
          AGENT_ID="$RUNNER_NAME_PREFIX-agent-$GITHUB_RUN_ID"
          GIT_ID="$RUNNER_NAME_PREFIX-git-$GITHUB_RUN_ID"
          echo "Starting Agent runner $AGENT_ID and isolated Git-only runner $GIT_ID on shared workspace $ROOT."
          echo "Agent and Git executor use different OS users; only the workspace group is shared."
          umask 0007
          set +e
          sudo -H -g mcp-workspace --preserve-env=MCP_TOKEN,HUB_URLS -u mcp-agent bash -c 'umask 0007; exec "$@"' _ timeout --signal=TERM --kill-after=40s "$DURATION_SECONDS" \
            "$BIN" --root "$ROOT" --port 8787 --tunnel hub \
            --hub-urls "$HUB_URLS" --runner-id "$AGENT_ID" --runner-tags "linux,agent,issue23,pair:${RUNNER_NAME_PREFIX}-${GITHUB_RUN_ID}" &
          AGENT_PID=$!
          sudo -H -g mcp-workspace --preserve-env=MCP_TOKEN,HUB_URLS,GIT_CREDENTIAL_URL,GIT_EXECUTOR_TOKEN,GITHUB_ACTOR,GITHUB_RUN_ID -u mcp-git bash -c 'umask 0007; exec "$@"' _ timeout --signal=TERM --kill-after=40s "$DURATION_SECONDS" \
            "$BIN" --root "$ROOT" --port 8788 --tunnel hub \
            --hub-urls "$HUB_URLS" --runner-id "$GIT_ID" --runner-tags "linux,git,isolated,pair:${RUNNER_NAME_PREFIX}-${GITHUB_RUN_ID}" \
            --tool-profile git-executor &
          GIT_PID=$!
          wait -n "$AGENT_PID" "$GIT_PID"; FIRST_STATUS=$?
          if [ "$FIRST_STATUS" -ne 124 ] && [ "$FIRST_STATUS" -ne 143 ]; then
            echo "::error title=Paired runner stopped unexpectedly::First runner exited with $FIRST_STATUS"
            sudo kill "$AGENT_PID" "$GIT_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$AGENT_PID"; AGENT_STATUS=$?
          wait "$GIT_PID"; GIT_STATUS=$?
          set -e
          if [ "$AGENT_STATUS" -eq 124 ] || [ "$AGENT_STATUS" -eq 143 ]; then AGENT_STATUS=0; fi
          if [ "$GIT_STATUS" -eq 124 ] || [ "$GIT_STATUS" -eq 143 ]; then GIT_STATUS=0; fi
          if [ "$AGENT_STATUS" -ne 0 ] || [ "$GIT_STATUS" -ne 0 ]; then
            echo "::error title=Paired runner stopped unexpectedly::Agent=$AGENT_STATUS Git=$GIT_STATUS"
            exit 1
          fi
