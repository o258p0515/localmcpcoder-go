name: Custom E2E Runner (hub-runner-e2e-mwzupct5.yml)
run-name: Hub runner ${{ inputs.runner_os }} / ${{ inputs.runner_name }} (g${{ inputs.generation || '1' }})
on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: "Unique runner name (for example build-01 or test-his)"
        type: string
        required: false
        default: "gha"
      runner_tags:
        description: "Comma-separated runner tags (for example windows,go,gha)"
        type: string
        required: false
        default: "linux,go,gha,agent"
      duration_seconds:
        description: "Runner lifetime in seconds (maximum 20400 / 5h40m)"
        type: number
        required: true
        default: 20400
      runner_os:
        description: "GitHub-hosted runner operating system"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - linux
          - windows
      account_alias:
        description: "RTDB account alias"
        type: string
        required: false
        default: "personal"
      predecessor_id:
        description: "Predecessor runner ID during make-before-break handover"
        type: string
        required: false
        default: ""
      generation:
        description: "Runner generation counter (1, 2, ...)"
        type: string
        required: false
        default: "1"
      handover_after:
        description: "Seconds after start to request handover (0 = auto duration_seconds - 600, -1 = disable)"
        type: string
        required: false
        default: "0"
      idle_timeout:
        description: "Seconds of inactivity with zero active requests before graceful exit (0 = disable)"
        type: string
        required: false
        default: "0"
permissions:
  contents: read
concurrency:
  # Every workflow run owns an independent runner so Make-Before-Break Gen 2 never kills Gen 1.
  group: localmcp-hub-runner-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ${{ (inputs.runner_os == 'windows' || inputs.runner_os == 'windows-latest') && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go/go.mod
      - name: Validate Hub configuration
        env:
          HUB_URLS: ${{ secrets.HUB_URLS }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          GENERATION: ${{ inputs.generation || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HUB_URLS MCP_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error title=Missing secret::$name is required"; exit 1; fi
          done
          if [ "${#MCP_TOKEN}" -lt 16 ]; then echo "::error title=Invalid token::MCP_TOKEN must be at least 16 characters"; exit 1; fi
          if ! [[ "$DURATION_SECONDS" =~ ^[0-9]+$ ]] || [ "$DURATION_SECONDS" -lt 60 ] || [ "$DURATION_SECONDS" -gt 20400 ]; then
            echo "::error title=Invalid duration::duration_seconds must be between 60 and 20400"; exit 1
          fi
          if ! [[ "$GENERATION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid generation::generation must be a positive integer"; exit 1
          fi
      - name: Build and test Go runner
        working-directory: go
        env:
          BINARY_EXT: ${{ (inputs.runner_os == 'windows' || inputs.runner_os == 'windows-latest') && '.exe' || '' }}
          RUNNER_OS: ${{ runner.os }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # These packages are OS-neutral and cover the Hub transport/runtime path.
            # The remaining packages currently assert POSIX chmod/setgid semantics.
            go test ./cmd/mcp ./internal/auth ./internal/fsx ./internal/hubclient ./internal/server ./internal/skills
          else
            go test ./...
          fi
          go build -trimpath -o "$RUNNER_TEMP/localmcpcoder-mcp$BINARY_EXT" ./cmd/mcp
      - name: Start outbound Hub runner
        env:
          HUB_URLS: ${{ secrets.HUB_URLS }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          TS_TRUST_CREDS: ${{ secrets.TS_TRUST_CREDS }}
          TS_TAGS: ${{ secrets.TS_TAGS }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          LOCALMCP_RUNNER_NAME: ${{ inputs.runner_name }}
          LOCALMCP_RUNNER_TAGS: ${{ inputs.runner_tags }}
          ACCOUNT_ALIAS: ${{ inputs.account_alias || 'personal' }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          PREDECESSOR_ID: ${{ inputs.predecessor_id }}
          GENERATION: ${{ inputs.generation || '1' }}
          HANDOVER_AFTER: ${{ inputs.handover_after || '0' }}
          IDLE_TIMEOUT: ${{ inputs.idle_timeout || '0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_OS: ${{ runner.os }}
          BINARY_EXT: ${{ (inputs.runner_os == 'windows' || inputs.runner_os == 'windows-latest') && '.exe' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mcp-root"
          mkdir -p "$ROOT"
          OS_TAG="linux"
          if [ "$RUNNER_OS" = "Windows" ]; then OS_TAG="windows"; fi
          LOCALMCP_RUNNER_ID="${LOCALMCP_RUNNER_NAME:-gha}-${GITHUB_RUN_ID}"
          META_TAGS="provider:github,os:${OS_TAG},account:${ACCOUNT_ALIAS},run:${GITHUB_RUN_ID},name:${LOCALMCP_RUNNER_NAME:-gha},gen:${GENERATION}"
          COMBINED_TAGS="${META_TAGS},${LOCALMCP_RUNNER_TAGS}"
          echo "::add-mask::$HUB_URLS"
          echo "Starting runner $LOCALMCP_RUNNER_ID (gen=$GENERATION, predecessor=${PREDECESSOR_ID:-none}) for $DURATION_SECONDS seconds; Hub endpoint is masked."
          EXTRA_ARGS=(
            --duration-seconds "$DURATION_SECONDS"
            --handover-after "$HANDOVER_AFTER"
            --idle-timeout "$IDLE_TIMEOUT"
            --generation "$GENERATION"
          )
          if [ -n "$PREDECESSOR_ID" ]; then
            EXTRA_ARGS+=(--predecessor-id "$PREDECESSOR_ID")
          fi
          set +e
          timeout --signal=TERM --kill-after=40s "${DURATION_SECONDS}s" \
            "$RUNNER_TEMP/localmcpcoder-mcp$BINARY_EXT" --root "$ROOT" --tunnel hub \
            --hub-urls "$HUB_URLS" \
            --runner-id "$LOCALMCP_RUNNER_ID" --runner-tags "$COMBINED_TAGS" \
            "${EXTRA_ARGS[@]}"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 143 ]; then
            echo "Planned runner lifetime ended; SIGTERM graceful drain was requested."
            exit 0
          fi
          exit "$STATUS"
