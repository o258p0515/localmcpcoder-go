name: LocalMCP Hub Runner
on:
  push:
    branches: [feat/localmcp-hub]
  workflow_dispatch:
    inputs:
      runner_name:
        description: "Unique runner name (for example build-01 or test-his)"
        type: string
        required: false
        default: "gha"
      runner_tags:
        description: "Comma-separated tags (for example linux,go,sandbox)"
        type: string
        required: false
        default: "linux,go,gha"
      duration_seconds:
        description: "Runner lifetime in seconds (maximum 20400 / 5h40m)"
        type: number
        required: true
        default: 20400
permissions:
  contents: read
concurrency:
  group: localmcp-hub-runner-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  runner:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go/go.mod
      - name: Validate duration and credentials
        env:
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          for name in CF_API_EMAIL CF_API_KEY CF_DOMAIN MCP_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "::error title=Missing secret::$name is required"; exit 1; fi
          done
          if ! [[ "$DURATION_SECONDS" =~ ^[0-9]+$ ]] || [ "$DURATION_SECONDS" -lt 60 ] || [ "$DURATION_SECONDS" -gt 20400 ]; then
            echo "::error title=Invalid duration::duration_seconds must be between 60 and 20400"; exit 1
          fi
      - name: Resolve Hub endpoint and derive runner secret
        working-directory: deploy/localmcp-hub
        env:
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
        run: node scripts/derive-runner-env.mjs
      - name: Build and test Go runner
        working-directory: go
        run: |
          set -euo pipefail
          go mod tidy
          go test ./...
          go build -trimpath -o "$RUNNER_TEMP/localmcpcoder-mcp" ./cmd/mcp
      - name: Start outbound Hub runner
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          RUNNER_NAME: ${{ inputs.runner_name }}
          RUNNER_TAGS: ${{ inputs.runner_tags }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mcp-root"
          mkdir -p "$ROOT"
          RUNNER_ID="${RUNNER_NAME:-gha}-${GITHUB_RUN_ID}"
          HUB_URLS="wss://$HUB_DOMAIN"
          echo "Starting runner $RUNNER_ID for $DURATION_SECONDS seconds; Hub endpoint is masked."
          set +e
          timeout --signal=TERM --kill-after=40s "${DURATION_SECONDS}s" \
            "$RUNNER_TEMP/localmcpcoder-mcp" --root "$ROOT" --tunnel hub \
            --hub-urls "$HUB_URLS" --hub-secret "$HUB_SHARED_SECRET" \
            --runner-id "$RUNNER_ID" --runner-tags "$RUNNER_TAGS"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 143 ]; then
            echo "Planned runner lifetime ended; SIGTERM graceful drain was requested."
            exit 0
          fi
          exit "$STATUS"
