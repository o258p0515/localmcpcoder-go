name: LocalMCP Hub Runner
on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: "Unique runner name (for example build-01 or test-his)"
        type: string
        required: false
        default: "gha"
      runner_tags:
        description: "Comma-separated tags (for example linux,go,sandbox)"
        type: string
        required: false
        default: "linux,go,gha"
      duration_seconds:
        description: "Runner lifetime in seconds (maximum 20400 / 5h40m)"
        type: number
        required: true
        default: 20400
permissions:
  contents: read
concurrency:
  group: localmcp-hub-runner-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go/go.mod
      - name: Validate Hub credentials and duration
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          HUB_URLS: ${{ secrets.HUB_URLS }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          for name in MCP_TOKEN HUB_URLS; do
            if [ -z "${!name:-}" ]; then echo "::error title=Missing secret::$name is required"; exit 1; fi
          done
          if [ "${#MCP_TOKEN}" -lt 16 ]; then echo "::error title=Invalid token::MCP_TOKEN must be at least 16 characters"; exit 1; fi
          if ! [[ "$DURATION_SECONDS" =~ ^[0-9]+$ ]] || [ "$DURATION_SECONDS" -lt 60 ] || [ "$DURATION_SECONDS" -gt 20400 ]; then
            echo "::error title=Invalid duration::duration_seconds must be between 60 and 20400"; exit 1
          fi
      - name: Build and test Go runner
        working-directory: go
        run: |
          set -euo pipefail
          go test ./...
          go build -trimpath -o "$RUNNER_TEMP/localmcpcoder-mcp" ./cmd/mcp
      - name: Start outbound Hub runner
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          HUB_URLS: ${{ secrets.HUB_URLS }}
          LOCALMCP_RUNNER_NAME: ${{ inputs.runner_name }}
          LOCALMCP_RUNNER_TAGS: ${{ inputs.runner_tags }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mcp-root"
          mkdir -p "$ROOT"
          LOCALMCP_RUNNER_ID="${LOCALMCP_RUNNER_NAME:-gha}-${GITHUB_RUN_ID}"
          echo "::add-mask::$HUB_URLS"
          echo "Starting runner $LOCALMCP_RUNNER_ID for $DURATION_SECONDS seconds; Hub endpoint is masked."
          set +e
          timeout --signal=TERM --kill-after=40s "${DURATION_SECONDS}s" \
            "$RUNNER_TEMP/localmcpcoder-mcp" --root "$ROOT" --tunnel hub \
            --hub-urls "$HUB_URLS" --runner-id "$LOCALMCP_RUNNER_ID" --runner-tags "$LOCALMCP_RUNNER_TAGS"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 143 ]; then
            echo "Planned runner lifetime ended; SIGTERM graceful drain was requested."
            exit 0
          fi
          exit "$STATUS"
