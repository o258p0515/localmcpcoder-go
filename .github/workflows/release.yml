name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'go/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Test, build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go/go.mod

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Build Linux, macOS and Windows binaries
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: make dist VERSION="$VERSION"

      - name: Generate SHA256 checksums
        run: cd dist && sha256sum mcp-* > SHA256SUMS

      - name: Publish rolling latest release for main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG=latest
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "Latest build (main)" --notes "Automatically rebuilt from commit $GITHUB_SHA." --prerelease=false
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Latest build (main)" \
              --notes "Automatically built from commit $GITHUB_SHA."
          fi

      - name: Publish versioned release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$GITHUB_REF_NAME"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --generate-notes
          fi
